spring:
  application:
    name: spec-project
  datasource:
    # H2 메모리 DB. 서버를 끄면 데이터가 사라지고, 띄울 때마다 새로 만든다.
    url: jdbc:h2:mem:specproject;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # @Entity 클래스를 보고 테이블을 만든다. 스키마 파일은 따로 두지 않는다.
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example: INFO
